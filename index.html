<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>행복주택 지도</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overflow: hidden; }
        
        /* 지도 전체 화면 */
        #map { width: 100%; height: 100vh; }

        /* 하단 정보 카드 (평소에는 숨겨져 있음) */
        #info-card {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateY(110%); /* 아래로 숨김 */
            transition: transform 0.3s ease-out; /* 부드럽게 올라오는 효과 */
            padding-bottom: 30px; /* 아이폰 하단 바 여백 */
            box-sizing: border-box;
        }

        /* 카드가 활성화되었을 때 */
        #info-card.active {
            transform: translateY(0);
        }

        /* 카드 내부 디자인 */
        .card-handle {
            width: 40px;
            height: 5px;
            background: #ddd;
            border-radius: 5px;
            margin: 10px auto;
        }
        .card-content {
            padding: 10px 20px 25px 20px;
        }
        .badge {
            display: inline-block;
            background: #eee;
            color: #555;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .badge.guan { background-color: #e3f2fd; color: #1976d2; } /* 관악구 강조 */

        h2 {
            margin: 5px 0 15px 0;
            font-size: 20px;
            color: #333;
        }

        /* 정보 테이블 */
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
            color: #666;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
        }
        .info-row:last-child { border: none; }
        
        .info-label { font-weight: normal; }
        .info-value { font-weight: bold; color: #333; }
        
        /* 월세 강조 */
        .price-highlight { color: #d32f2f; font-size: 17px; }

    </style>
</head>
<body>

    <div id="map"></div>

    <div id="info-card">
        <div class="card-handle"></div>
        <div class="card-content" id="card-inner">
            </div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc36e0ea25758cc3e8da9744bfd7e612"></script>
    
    <script>
        var mapContainer = document.getElementById('map'); 
        var mapOption = { 
            center: new kakao.maps.LatLng(37.514575, 127.0495556), 
            level: 8 
        };

        var map = new kakao.maps.Map(mapContainer, mapOption); 

        // 데이터
        var positions = [
            { region: "관악", title: "e편한세상 서울대입구", type: "예비4", deposit: "1억 9,150만", rent: "26만 5,500원", lat: 37.4814, lng: 126.9423 },
            { region: "영등포", title: "당산센트럴 아이파크", type: "일반5+예비9", deposit: "2억 3,660만", rent: "32만 3,000원", lat: 37.5250, lng: 126.9020 },
            { region: "동작", title: "보라매 자이", type: "일반6+예비10", deposit: "2억 3,850만", rent: "32만 500원", lat: 37.5025, lng: 126.9205 },
            { region: "송파", title: "잠실올림픽공원 아이파크", type: "일반3+예비10", deposit: "2억 7,210만", rent: "35만 2,500원", lat: 37.5320, lng: 127.1185 },
            { region: "강동", title: "고덕 그라시움", type: "예비10", deposit: "2억 1,580만", rent: "29만 9,000원", lat: 37.5565, lng: 127.1640 },
            { region: "강동", title: "롯데캐슬 베네루체", type: "예비6", deposit: "2억 820만", rent: "28만 9,000원", lat: 37.5510, lng: 127.1630 },
            { region: "서초", title: "반포래미안 아이파크", type: "예비15", deposit: "2억 9,120만", rent: "40만 4,000원", lat: 37.5015, lng: 127.0125 },
            { region: "서초", title: "반포써밋", type: "예비10", deposit: "2억 9,980만", rent: "41만 5,000원", lat: 37.5042, lng: 127.0150 },
            { region: "서초", title: "래미안 신반포 리오센트", type: "일반3+예비6", deposit: "2억 9,770만", rent: "41만 2,500원", lat: 37.5143, lng: 127.0095 },
            { region: "서초", title: "디에이치 반포 라클라스", type: "예비15", deposit: "3억 660만", rent: "42만 5,000원", lat: 37.5013, lng: 127.0088 },
            { region: "서초", title: "래미안 리더스원", type: "일반3+예비10", deposit: "3억 660만", rent: "42만 5,000원", lat: 37.4925, lng: 127.0275 }
        ];

        var activeMarker = null; // 현재 선택된 마커

        // 마커 이미지 생성 (파란색 기본 핀)
        // 관악구만 빨간색으로 표시하고 싶다면 이미지를 분기처리할 수도 있습니다.
        
        positions.forEach(function(pos) {
            var marker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(pos.lat, pos.lng)
            });

            // 마커 클릭 이벤트
            kakao.maps.event.addListener(marker, 'click', function() {
                showInfoCard(pos);
                // 지도 중심을 부드럽게 이동 (살짝 아래로 이동해서 핀이 카드에 안 가려지게)
                var moveLatLon = new kakao.maps.LatLng(pos.lat - 0.003, pos.lng);
                map.panTo(moveLatLon);
            });
        });

        // 지도 빈 곳 클릭 시 카드 숨기기
        kakao.maps.event.addListener(map, 'click', function() {
            hideInfoCard();
        });

        var card = document.getElementById('info-card');
        var cardInner = document.getElementById('card-inner');

        function showInfoCard(data) {
            var badgeClass = data.region === "관악" ? "badge guan" : "badge";
            
            var html = `
                <span class="${badgeClass}">${data.region}</span>
                <h2>${data.title}</h2>
                <div class="info-row">
                    <span class="info-label">모집호수</span>
                    <span class="info-value">${data.type}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">최대보증금</span>
                    <span class="info-value">${data.deposit}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">월임대료</span>
                    <span class="info-value price-highlight">${data.rent}</span>
                </div>
            `;
            
            cardInner.innerHTML = html;
            card.classList.add('active');
        }

        function hideInfoCard() {
            card.classList.remove('active');
        }

    </script>
</body>
</html>
