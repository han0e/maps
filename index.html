<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
    #map { position: absolute; top: env(safe-area-inset-top); left: env(safe-area-inset-left);
           right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom);
           width: 100%; height: 100%; }
    .info-window { font-size: 14px; line-height: 1.4; padding: 8px; max-width: 250px; }
    .info-window strong { font-size: 15px; }
    @media (max-width: 600px) { .info-window { font-size: 12px; } }
  </style>
</head>
<body>

            { name: '래미안장위퍼스트하이', address: '서울 성북구 장위동 173-11', heating: '개별난방', units:[{size:'46㎡', price:'14,700만원'}]},
            { name: '송파헬리오시티', address: '서울 송파구 가락동 479', heating: '지역난방', units:[{size:'39㎡', price:'13,680만원'}, {size:'49㎡', price:'16,720만원'}]},

            { name: '힐스테이트녹번', address: '서울 은평구 녹번동 53', heating: '개별난방', units:[{size:'40㎡', price:'13,560만원'}]},
            { name: '백련산SK VIEW IPARK', address: '서울 은평구 응암동 419', heating: '개별난방', units:[{size:'40㎡', price:'11,840만원'}]},
            { name: 'DMC롯데캐슬더퍼스트', address: '서울 은평구 수색동 115-5', heating: '개별난방', units:[{size:'49㎡', price:'16,968만원'}]},
            { name: '녹번역이편한세상캐슬', address: '서울 은평구 응암동 36', heating: '개별난방', units:[{size:'39㎡', price:'14,520만원'}]},
            { name: 'DMC센트럴자이', address: '서울 은평구 증산동 213-20', heating: '개별난방', units:[{size:'40㎡', price:'9,666만원'}]},
            { name: '경희궁자이', address: '서울 종로구 교남동 62-1', heating: '지역난방', units:[{size:'39㎡', price:'14,720만원'}]}
        ];
        
        const geocoder = new kakao.maps.services.Geocoder();
        let currentInfo = null;

        complexes.forEach(c => {
          geocoder.addressSearch(c.address, (results, status) => {
            if (status === kakao.maps.services.Status.OK) {
              const { x, y } = results[0];
              const pos = new kakao.maps.LatLng(y, x);
              const marker = new kakao.maps.Marker({ map, position: pos });

              const content = `
                <div class="info-window">
                  <strong>${c.name}</strong><br>
                  <span style="color:#555;">${c.address}</span><br>
                  <hr style="border:0; border-top:1px solid #eee; margin:5px 0;">
                  ${c.units.map(u => `
                    <div style="margin-top:5px;">
                      ${toPyeong(u.size)}평(${u.size}) · <strong>${u.price}</strong>
                    </div>
                  `).join('')}
                </div>
              `;
              const infoWin = new kakao.maps.InfoWindow({ content, removable: true });
              
              kakao.maps.event.addListener(marker, 'click', () => {
                if (currentInfo) currentInfo.close();
                infoWin.open(map, marker);
                currentInfo = infoWin;
              });
            } else {
              console.warn('주소 검색 실패: ' + c.address);
            }
          });
        });

        kakao.maps.event.addListener(map, 'click', function() {
            if (currentInfo) {
                currentInfo.close();
                currentInfo = null;
            }
        });
      });
    });
  </script>
</body>
</html>
