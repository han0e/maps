<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>서울시 장기전세주택 (신혼부부 대상) 공급지도</title>
  <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc36e0ea25758cc3e8da9744bfd7e612&libraries=services&autoload=false"></script>
 <style>
   html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
   #map { position: absolute; top: env(safe-area-inset-top); left: env(safe-area-inset-left);
          right: env(safe-area-inset-right); bottom: env(safe-area-inset-bottom);
          width: 100%; height: 100%; }
   .info-window {
     font-size: 14px;
     line-height: 1.6;
     padding: 10px;
     /* ✅ 최대 너비 증가 */
     max-width: 300px;
     /* ✅ 긴 단어 줄바꿈 처리 */
     word-break: break-word;
   }
   .info-window .title { font-weight: bold; font-size: 16px; }
   .info-window .address { font-size: 12px; color: #666; }
   .info-window hr { border: 0; border-top: 1px solid #eee; margin: 8px 0; }
   .info-window .unit-info { font-size: 13px; }
   .info-window .price-info { font-size: 13px; }
   .info-window strong { color: #E65A2D; }
 </style>
</head>
<body>
  <div id="map"></div>
  <script>
    window.addEventListener('load', function() {
      kakao.maps.load(function() {
        const map = new kakao.maps.Map(
          document.getElementById('map'),
          { center: new kakao.maps.LatLng(37.5665, 126.9780), level: 9 }
        );

        function toPyeong(size) { return (parseFloat(size.replace('㎡',''))/3.3058).toFixed(1); }
        function toEokwon(manwon) { return (manwon / 10000).toFixed(1) + '억원'; }
        
        // ✅ 요청하신 새 주소로 업데이트
        const complexes = [
            { name: '리버센 SK뷰 롯데캐슬', address: '중랑구 중화동 331-1', units:[{size:'39㎡', price:10080, rent:37.7}]},
            { name: '삼성동센트럴아이파크', address: '강남구 삼성동 188', units:[{size:'49㎡', price:18400, rent:72.1}]},
            { name: '래미안개포루체하임', address: '강남구 일원동 741', units:[{size:'49㎡', price:18080, rent:71.0}]},
            { name: '디에이치자이 개포', address: '강남구 일원동 743', units:[{size:'44㎡', price:16400, rent:64.1}]},
            { name: '래미안라클래시', address: '강남구 삼성동 189', units:[{size:'59㎡', price:23040, rent:90.3}]},
            { name: '디에이치퍼스티어아이파크', address: '강남구 개포동 660-4', units:[{size:'59㎡', price:20880, rent:81.9}]},
            { name: '고덕센트럴푸르지오', address: '강동구 고덕동 210-1', units:[{size:'40㎡', price:10480, rent:40.3}]},
            { name: '꿈의숲 효성해링턴플레이스', address: '강북구 미아동 1369', units:[{size:'49㎡', price:10000, rent:40.9}]},
            { name: '신마곡 벽산블루밍', address: '강서구 방화동 904', units:[{size:'59㎡', price:15280, rent:53.5}]},
            { name: '천왕이펜하우스 8단지', address: '구로구 천왕동 275', units:[{size:'45㎡', price:8720, rent:32.7}]},
            { name: '고척리본타운', address: '구로구 고척동 156', units:[{size:'45㎡', price:8880, rent:36.2}]},
            { name: '포레나노원', address: '노원구 상계동 680', units:[{size:'49㎡', price:10960, rent:43.0}]},
            { name: '래미안 로이파크', address: '동작구 사당동 1159', units:[{size:'59㎡', price:17680, rent:64.8}]},
            { name: '북한산두산위브', address: '서대문구 홍은동 467', units:[{size:'40㎡', price:15849, rent:55.4}]},
            { name: '래미안서초에스티지S', address: '서초구 서초동 1754', units:[{size:'59㎡', price:20560, rent:78.9}]},
            { name: '신반포자이', address: '서초구 잠원동 160', units:[{size:'59㎡', price:21920, rent:84.0}]},
            { name: '래미안 신반포 리오센트', address: '서초구 잠원동 161', units:[{size:'48㎡', price:17440, rent:66.7}]},
            { name: '서초그랑자이', address: '서초구 효령로 391', units:[{size:'59㎡', price:22000, rent:84.4}]},
            { name: '롯데캐슬 골든힐스', address: '성북구 길음동 1287-1', units:[{size:'59㎡', price:13680, rent:52.3}]},
            { name: '래미안아트리치', address: '성북구 석관동 410', units:[{size:'39㎡', price:11880, rent:45.5}]},
            { name: '래미안장위퍼스트하이', address: '성북구 장위동 320', units:[{size:'46㎡', price:14700, rent:57.0}]},
            { name: '송파헬리오시티', address: '송파구 가락동 913', units:[{size:'39㎡', price:13680, rent:47.9}, {size:'49㎡', price:16720, rent:58.6}]},
            { name: 'e편한세상 송파파크센트럴', address: '송파구 거여동 617-4', units:[{size:'45㎡', price:14320, rent:50.2}]},
            { name: '송파시그니처롯데캐슬', address: '송파구 거마로 56', units:[{size:'41㎡', price:13120, rent:46.0}, {size:'39㎡', price:14376, rent:49.1}]},
            { name: '신목동비바힐스', address: '양천구 신월동 981-2', units:[{size:'58㎡', price:12880, rent:51.6}]},
            { name: '이든채', address: '양천구 신정동 1320-8', units:[{size:'44㎡', price:9720, rent:36.5}]},
            { name: '당산센트럴아이파크', address: '영등포구 당산동5가 43', units:[{size:'46㎡', price:13520, rent:50.6}]},
            { name: '신길센트럴아이파크', address: '영등포구 신길동 4955', units:[{size:'49㎡', price:20280, rent:73.3}]},
            { name: '용산센트럴파크 헤링턴스퀘어', address: '용산구 서빙고로 17', units:[{size:'40㎡', price:21360, rent:87.2}]},
            { name: '힐스테이트녹번', address: '은평구 녹번동 282', units:[{size:'40㎡', price:13560, rent:52.0}]},
            { name: '백련산SK VIEW IPARK', address: '은평구 응암동 767', units:[{size:'40㎡', price:11840, rent:45.4}]},
            { name: 'DMC롯데캐슬더퍼스트', address: '은평구 수색동 417', units:[{size:'49㎡', price:16968, rent:59.7}]},
            { name: '녹번역이편한세상캐슬', address: '은평구 은평로 220', units:[{size:'39㎡', price:14520, rent:52.9}]},
            { name: 'DMC센트럴자이', address: '은평구 증산동 258', units:[{size:'40㎡', price:9666, rent:35.4}]},
            { name: '경희궁자이', address: '종로구 행촌동 211', units:[{size:'39㎡', price:14720, rent:57.7}]}
        ];
        
        const geocoder = new kakao.maps.services.Geocoder();
        let currentInfo = null;

        function createMarkerAndInfoWindow(coords, complexData) {
            const marker = new kakao.maps.Marker({ map, position: coords });
            
            const content = `
                <div class="info-window">
                  <div class="title">${complexData.name}</div>
                  <div class="address">${complexData.address}</div>
                  <hr>
                  ${complexData.units.map(u => `
                    <div>
                      <div class="unit-info">${toPyeong(u.size)}평 (${u.size})</div>
                      <div class="price-info">
                        보증금 <strong>${toEokwon(u.price)}</strong> / 월 <strong>${u.rent.toLocaleString()}만원</strong>
                      </div>
                    </div>
                  `).join('<hr>')}
                </div>
              `;
            const infoWin = new kakao.maps.InfoWindow({ content, removable: true });
            
            kakao.maps.event.addListener(marker, 'click', () => {
              if (currentInfo) currentInfo.close();
              infoWin.open(map, marker);
              currentInfo = infoWin;
            });
        }

        complexes.forEach(c => {
            // lat, lng 값이 없으면 주소 검색 실행
            geocoder.addressSearch(c.name, (results, status) => {
                if (status === kakao.maps.services.Status.OK) {
                    const coords = new kakao.maps.LatLng(results[0].y, results[0].x);
                    createMarkerAndInfoWindow(coords, c);
                } else {
                    console.warn(`'${c.name}' 이름 검색 실패, 주소로 재시도...`);
                    geocoder.addressSearch(c.address, (results2, status2) => {
                        if(status2 === kakao.maps.services.Status.OK) {
                            const coords = new kakao.maps.LatLng(results2[0].y, results2[0].x);
                            createMarkerAndInfoWindow(coords, c);
                        } else {
                            console.error(`'${c.address}' 주소 검색도 최종 실패`);
                        }
                    });
                }
            });
        });

        kakao.maps.event.addListener(map, 'click', function() {
            if (currentInfo) {
                currentInfo.close();
                currentInfo = null;
            }
        });
      });
    });
  </script>
</body>
</html>
