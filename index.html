        newlywedHousingData.forEach(data => {

              const coords = new kakao.maps.LatLng(results[0].y, results[0].x);
              const marker = new kakao.maps.Marker({ map: map, position: coords, title: data.name });

                               <div class="title">${data.name}</div>
                               <div class="address">${data.address}</div>`;
              
              newlywedUnits.forEach(unit => {
                content += `<div class="unit">
                              <strong>${unit.type}</strong><br>
                              보증금: ${unit.deposit.toLocaleString()}만원 / 월세: ${unit.rent.toLocaleString()}만원
                            </div>`;
              });
              content += `</div>`;

              const infoWindow = new kakao.maps.InfoWindow({ content: content, removable: true });

              kakao.maps.event.addListener(marker, 'click', () => {
                if (currentInfoWindow) currentInfoWindow.close();
                infoWindow.open(map, marker);
                currentInfoWindow = infoWindow;
                map.panTo(coords);
              });
            } else {
              console.warn(`주소 검색 실패: ${data.address}`);
            }
          });
        });

        // 지도 클릭 시 열려있는 정보창을 닫습니다.
        kakao.maps.event.addListener(map, 'click', function() {
            if (currentInfoWindow) {
                currentInfoWindow.close();
                currentInfoWindow = null;
            }
        });
      });
    });
  </script>
</body>
</html>
