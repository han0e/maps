<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>행복주택 지도</title>
    <style>
        body { margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; overflow: hidden; }
        
        /* 지도 전체 화면 */
        #map { width: 100%; height: 100vh; }

        /* 하단 정보 카드 (평소에는 숨겨져 있음) */
        #info-card {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: #fff;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.2);
            z-index: 1000;
            transform: translateY(110%); /* 아래로 숨김 */
            transition: transform 0.3s ease-out; /* 부드럽게 올라오는 효과 */
            padding-bottom: 30px; /* 아이폰 하단 바 여백 */
            box-sizing: border-box;
        }

        /* 카드가 활성화되었을 때 */
        #info-card.active {
            transform: translateY(0);
        }

        /* 카드 내부 디자인 */
        .card-handle {
            width: 40px;
            height: 5px;
            background: #ddd;
            border-radius: 5px;
            margin: 10px auto;
        }
        .card-content {
            padding: 10px 20px 25px 20px;
        }
        .badge {
            display: inline-block;
            background: #eee;
            color: #555;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .badge.guan { background-color: #e3f2fd; color: #1976d2; } /* 관악구 강조 */

        h2 {
            margin: 5px 0 15px 0;
            font-size: 20px;
            color: #333;
        }

        /* 정보 테이블 */
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 15px;
            color: #666;
            border-bottom: 1px solid #f0f0f0;
            padding-bottom: 8px;
        }
        .info-row:last-child { border: none; }
        
        .info-label { font-weight: normal; }
        .info-value { font-weight: bold; color: #333; }
        
        /* 월세 강조 */
        .price-highlight { color: #d32f2f; font-size: 17px; }

    </style>
</head>
<body>

    <div id="map"></div>

    <div id="info-card">
        <div class="card-handle"></div>
        <div class="card-content" id="card-inner">
            </div>
    </div>

    <script type="text/javascript" src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=cc36e0ea25758cc3e8da9744bfd7e612"></script>
    
    <script>
        var mapContainer = document.getElementById('map'); 
        var mapOption = { 
            center: new kakao.maps.LatLng(37.514575, 127.0495556), 
            level: 8 
        };

        var map = new kakao.maps.Map(mapContainer, mapOption); 

// 업데이트된 데이터 (사용자 제공 핀 좌표 반영 완료)
var positions = [
    // --- [신규공급] 서울시 매입형 ---
    { region: "강북", title: "엘리프 미아역", type: "일반15+우선2", deposit: "4억 9,374만", rent: "0원", lat: 37.6258, lng: 127.0257 },
    { region: "동작", title: "힐스테이트 동작 시그니처", type: "일반91+우선10", deposit: "4억 6,956만", rent: "0원", lat: 37.5024, lng: 126.9455 },
    { region: "동작", title: "동작 보라매역 프리센트", type: "일반14+우선3", deposit: "3억 6,426만", rent: "0원", lat: 37.4918, lng: 126.9197 },

    // --- [재공급/예비] 공사 건설형 ---
    { region: "강남", title: "세곡지구(강남데시앙 등)", type: "예비13", deposit: "6억 1,698만", rent: "0원", lat: 37.4645, lng: 127.1054 },
    { region: "강남", title: "세곡2지구(래미안포레 등)", type: "예비54", deposit: "5억 1,402만", rent: "0원", lat: 37.4831, lng: 127.1012 },
    { region: "강동", title: "강일지구(리버파크 등)", type: "예비10", deposit: "5억 1,090만", rent: "0원", lat: 37.5645, lng: 127.1732 },
    { region: "강동", title: "고덕강일2지구(리버스트 등)", type: "예비32", deposit: "4억 2,510만", rent: "0원", lat: 37.5671, lng: 127.1742 },
    { region: "강서", title: "마곡지구(마곡엠밸리 등)", type: "예비96", deposit: "4억 9,920만", rent: "0원", lat: 37.5663, lng: 126.8255 },
    { region: "구로", title: "천왕지구(이펜하우스 등)", type: "예비4", deposit: "4억 2,276만", rent: "0원", lat: 37.4842, lng: 126.8378 },
    { region: "마포", title: "상암2지구(월드컵파크 9~12)", type: "예비12", deposit: "5억 76만", rent: "0원", lat: 37.5841, lng: 126.8795 },
    { region: "서초", title: "내곡지구(포레스타 등)", type: "예비54", deposit: "5억 7,096만", rent: "0원", lat: 37.4621, lng: 127.0544 },
    { region: "송파", title: "위례포레샤인 18, 23단지", type: "예비20", deposit: "5억 3,196만", rent: "0원", lat: 37.4812, lng: 127.1425 },
    { region: "양천", title: "신정3지구(이펜하우스 등)", type: "예비15", deposit: "3억 7,752만", rent: "0원", lat: 37.5147, lng: 126.8302 },
    { region: "은평", title: "은평뉴타운(구파발, 마고정 등)", type: "예비223", deposit: "4억 3,368만", rent: "0원", lat: 37.6366, lng: 126.9194 },
    { region: "의정부", title: "수락리버시티 1, 2단지", type: "예비9", deposit: "3억 4,944만", rent: "0원", lat: 37.6821, lng: 127.0545 },

    // --- [재공급/예비] 서울시 매입형 ---
    { region: "강남", title: "역삼자이", type: "예비2", deposit: "8억 8,140만", rent: "0원", lat: 37.5015, lng: 127.0435 },
    { region: "강남", title: "청담르엘", type: "예비12", deposit: "7억 7,298만", rent: "0원", lat: 37.5251, lng: 127.0518 },
    { region: "동대문", title: "이문 아이파크 자이", type: "예비55", deposit: "3억 2,214만", rent: "0원", lat: 37.5997, lng: 127.0624 },
    { region: "서초", title: "메이플자이", type: "예비5", deposit: "6억 9,966만", rent: "0원", lat: 37.5098, lng: 127.0102 },
    { region: "서초", title: "반포자이", type: "예비11", deposit: "9억 5,940만", rent: "0원", lat: 37.5052, lng: 127.0116 },
    { region: "송파", title: "잠실래미안아이파크", type: "예비77", deposit: "5억 2,806만", rent: "0원", lat: 37.5195, lng: 127.1118 },

    // --- [재공급/예비] 서울리츠3호 ---
    { region: "중랑", title: "신내데시앙포레", type: "일반1+예비2", deposit: "4억 5,552만", rent: "0원", lat: 37.6148, lng: 127.1062 },
    { region: "강동", title: "강일리버파크 2,9,10단지", type: "예비30", deposit: "5억 8,266만", rent: "0원", lat: 37.5645, lng: 127.1732 },
    { region: "강서", title: "마곡엠벨리 2, 14단지", type: "예비3", deposit: "6억 5,676만", rent: "0원", lat: 37.5663, lng: 126.8255 }
];
        
        var activeMarker = null; // 현재 선택된 마커

        // 마커 이미지 생성 (파란색 기본 핀)
        // 관악구만 빨간색으로 표시하고 싶다면 이미지를 분기처리할 수도 있습니다.
        
        positions.forEach(function(pos) {
            var marker = new kakao.maps.Marker({
                map: map,
                position: new kakao.maps.LatLng(pos.lat, pos.lng)
            });

            // 마커 클릭 이벤트
            kakao.maps.event.addListener(marker, 'click', function() {
                showInfoCard(pos);
                // 지도 중심을 부드럽게 이동 (살짝 아래로 이동해서 핀이 카드에 안 가려지게)
                var moveLatLon = new kakao.maps.LatLng(pos.lat - 0.003, pos.lng);
                map.panTo(moveLatLon);
            });
        });

        // 지도 빈 곳 클릭 시 카드 숨기기
        kakao.maps.event.addListener(map, 'click', function() {
            hideInfoCard();
        });

        var card = document.getElementById('info-card');
        var cardInner = document.getElementById('card-inner');

        function showInfoCard(data) {
            var badgeClass = data.region === "관악" ? "badge guan" : "badge";
            
            var html = `
                <span class="${badgeClass}">${data.region}</span>
                <h2>${data.title}</h2>
                <div class="info-row">
                    <span class="info-label">모집호수</span>
                    <span class="info-value">${data.type}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">최대보증금</span>
                    <span class="info-value">${data.deposit}</span>
                </div>
                <div class="info-row">
                    <span class="info-label">월임대료</span>
                    <span class="info-value price-highlight">${data.rent}</span>
                </div>
            `;
            
            cardInner.innerHTML = html;
            card.classList.add('active');
        }

        function hideInfoCard() {
            card.classList.remove('active');
        }

    </script>
</body>
</html>
